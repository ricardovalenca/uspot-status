# Página de status do USPOT (18.5.4): testa a cada 5 minutos, fora dos servidores do USPOT.
# Hoje aponta para a homologação; com a produção, troca-se pelos endereços dela.
owner: ricardovalenca
repo: uspot-status

sites:
  - name: API
    url: https://api-hml.uspot.com.br/health
  - name: Localização (Por perto e encontros)
    url: https://loc-hml.uspot.com.br/health
  - name: Tempo real
    # Sem o pedido de websocket o Centrifugo responde 400: é o sinal de que está de pé.
    url: https://rt-hml.uspot.com.br/connection/websocket
    expectedStatusCodes:
      - 400
  - name: Página do convite
    url: https://hml.uspot.com.br

status-website:
  cname: status.uspot.com.br
  name: USPOT
  introTitle: "**Status do USPOT**"
  introMessage: Se o app não estiver funcionando, veja aqui se é algo nosso. Os testes rodam a cada 5 minutos.
  navbar:
    - title: Status
      href: /

